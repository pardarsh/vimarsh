# https://pre-commit.com
# Install once with `pre-commit install`; run on everything with `pre-commit run --all-files`.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Templates: a formatter and linter that understands Jinja tags, so plain-HTML
  # formatters cannot silently break {% %} / {{ }} syntax.
  - repo: https://github.com/djlint/djLint
    rev: v1.46.4
    hooks:
      - id: djlint-reformat
        files: ^src/vimarsh/templates/.*\.html$
      - id: djlint
        files: ^src/vimarsh/templates/.*\.html$

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
