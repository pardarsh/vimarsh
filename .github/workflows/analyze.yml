# Daily: analyse up to MAX_BILLS_PER_RUN pending bills (newest first) that were
# introduced on or after SINCE_DATE. Can also be started by hand.
name: Analyze bills (daily)

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

# Shared with analyze-bills.yml so two runs never push at the same time.
concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    uses: ./.github/workflows/_analyze.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
